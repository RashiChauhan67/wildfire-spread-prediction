name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # CPU-only TensorFlow keeps the install small; tests use synthetic data, no dataset needed.
      - name: Install
        run: |
          pip install "tensorflow-cpu>=2.16,<2.20" numpy pytest ruff
          pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
