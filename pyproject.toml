[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-spread-prediction"
version = "0.1.0"
description = "Next-day wildfire spread prediction with an Attention U-Net"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rashi Chauhan" }]
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.16,<2.20",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
viz = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["notebooks"]  # original notebook is kept unmodified

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
